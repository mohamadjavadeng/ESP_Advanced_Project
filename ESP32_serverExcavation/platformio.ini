; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32 Excavation Server
;   - SoftAP "ESP32_Server" @ 192.168.4.1
;   - Own MPU6050 -> boom angle (theta1)
;   - Receives stick angle from ExcavatorClient (GET /data)
;   - Receives alarms + target depth from Raspberry Pi (POST /alarm, JSON)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; MPU6050 is vendored under lib/ (copied from ExcavatorClient).
; Only ArduinoJson is pulled from the registry.
board_build.partitions = ./partitions.csv
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
