; PlatformIO Project Configuration File
;
; ESP32 BEAM (boom) angle sensor (RPi-centric excavation system)
;   - Joins the field WiFi as a STATION
;   - Reads boom tilt from an MPU6050 (DMP)
;   - PUSHes the RAW angle to the Raspberry Pi:  POST http://<RPI>:8080/ingest
;
;   - ALSO runs an AP + web config portal (src/web_config.cpp): SSID "EXCAV-BEAM"
;     on http://192.168.4.1/ for wifi/Pi-IP/beam-length entry + live angle.
;     WebServer, ESPmDNS and Preferences ship with the Arduino core, so the
;     portal needs NO extra lib_deps.
;
; Identical to ESP32_Stick except DEVICE_ID = "beam" in src/main.cpp.
; MPU6050 is REUSED from the vendored copy in ExcavatorClient/lib via
; lib_extra_dirs; only ArduinoJson comes from the registry.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 4 MB flash, single large app slot (no OTA) -- see partitions.csv.
board_build.partitions = partitions.csv
lib_extra_dirs =
    ../../ExcavatorClient/lib      ; was a typo ("libf"); the local lib/MPU6050 is
                                   ; what actually builds either way
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
