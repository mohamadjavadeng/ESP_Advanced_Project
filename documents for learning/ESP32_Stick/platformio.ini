; PlatformIO Project Configuration File
;
; ESP32 STICK angle + GPS sensor (RPi-centric excavation system)
; Board: LilyGO T-SIM7000G (ESP32-WROVER + SIM7000G LTE/GNSS, 4 MB flash)
;   - Joins the field WiFi as a STATION
;   - Core 1: reads stick tilt from an MPU6050 (DMP) -> POST /ingest   @ 1 Hz
;   - Core 0: reads a GNSS fix from the SIM7000G     -> POST /location @ 5 min
;   - ALSO runs an AP + web config portal (src/web_config.cpp): SSID "EXCAV-STICK"
;     on http://192.168.5.1/ for wifi/Pi-IP/stick-length entry + live angle & GNSS.
;     WebServer, ESPmDNS and Preferences ship with the Arduino core, so the
;     portal needs NO extra lib_deps.
;
; The SIM7000G is used ONLY as a GNSS receiver (no SIM / no cellular data);
; both streams leave over WiFi to the Raspberry Pi.
;
; MPU6050 is REUSED from the known-good vendored copy in ExcavatorClient/lib via
; lib_extra_dirs (no duplication). ArduinoJson + TinyGSM come from the registry.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; 4 MB flash, single large app slot (no OTA) -- see partitions.csv.
board_build.partitions = partitions.csv

build_flags =
    -D TINY_GSM_MODEM_SIM7000      ; LilyGO T-SIM7000G modem family
    -D TINY_GSM_RX_BUFFER=1024     ; headroom for AT+CGNSINF GNSS sentences

lib_extra_dirs =
    ../../ExcavatorClient/lib      ; reuse vendored MPU6050 (DMP)
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    vshymanskyy/TinyGSM@^0.12.0