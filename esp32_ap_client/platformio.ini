; PlatformIO project: ESP32 client for the Raspberry Pi access point.
;
; Joins the Pi's OWN WiFi AP (SSID "RPi_AP", Pi fixed IP 192.168.50.1) created by
; raspberry_pi/ap_sta_setup.py, then every few seconds:
;     POST /ingest  {json sample}   -> raspberry_pi/ap_demo_server.py
;     GET  /latest                  -> reads back what the Pi stored
; Serial @115200 shows both round-trips.
;
; Same board/toolchain as the other ESP32 units in this repo (esp32dev, ArduinoJson v7).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
